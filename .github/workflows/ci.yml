name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Least privilege: the validation job only ever reads the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step: the suite uses only the Node built-in test runner.
      - name: Validate
        run: node --test
